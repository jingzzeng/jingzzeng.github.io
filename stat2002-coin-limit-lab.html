<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>掷硬币实验 · 大数定律与中心极限定理</title><style>
:root{--bg:#f4f6f3;--ink:#19333c;--muted:#586d75;--line:#d7e1df;--blue:#246f83;--orange:#d8793f}*{box-sizing:border-box}body{margin:0;font:16px/1.7 system-ui,-apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:1240px;margin:auto;padding:32px 28px 55px}header{max-width:930px}.eyebrow{font-size:12px;color:var(--blue);letter-spacing:.15em}h1{font-size:clamp(28px,4vw,42px);margin:10px 0;line-height:1.3}h2{font-size:22px;margin:0 0 6px}p{margin:8px 0}.muted{color:var(--muted)}.toolbar{background:white;border:1px solid var(--line);border-radius:15px;padding:18px 22px;margin:25px 0;display:flex;gap:18px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:8px 13px;border:1px solid #b9cccd;border-radius:8px;background:white;color:var(--ink);cursor:pointer}button:hover{background:#edf3f2}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover{background:#19596c}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #db984e;outline-offset:3px}input{accent-color:var(--blue)}.group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.speed{width:105px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:22px;min-width:0}.subtitle{font-size:14px;color:var(--muted);min-height:48px}.formula{font-family:Georgia,"Times New Roman",serif;font-size:21px;margin:12px 0}.chart{width:100%;height:325px;display:block}.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted)}.swatch{display:inline-block;width:20px;height:9px;background:#dcece2;margin-right:5px}.swatch.line{height:0;border-top:2px solid var(--orange);vertical-align:middle;background:none}.metrics{display:flex;gap:22px;flex-wrap:wrap;margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line)}.metric{flex:1;min-width:125px}.metric strong{font-size:29px;font-weight:550;font-variant-numeric:tabular-nums;display:block}.small{font-size:13px;color:var(--muted)}.live{margin:18px 0;background:#e8efec;padding:14px 18px;border-radius:10px;min-height:58px;font-variant-numeric:tabular-nums}.explain{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:22px}.explain>div{padding:4px 12px;border-left:3px solid var(--blue)}.explain>div:last-child{border-color:var(--orange)}details{margin-top:25px;border-top:1px solid var(--line);padding-top:15px}summary{cursor:pointer;color:var(--blue)}footer{margin-top:24px;font-size:13px;color:var(--muted)}.badge{font-size:13px;letter-spacing:.02em;color:var(--blue);margin-bottom:4px}.instruction{padding-top:18px;font-size:14px}.status{font-size:13px;color:var(--muted)}@media(max-width:790px){main{padding:24px 16px}.grid,.explain{grid-template-columns:1fr}.panel{padding:17px}.toolbar{padding:16px}.subtitle{min-height:0}.chart{height:300px}}
</style></head><body><main><header><div class="eyebrow">STAT2002 / LAB 03</div><h1>小球落下，看见两个极限定理</h1><p class="muted">每轮独立掷 <i>n</i> 次硬币（正面概率为 p），算出正面频率。<strong>一个小球代表一整轮实验</strong>；同一轮的结果会同时落进左右两张直方图。</p></header>
<div class="toolbar"><div class="group"><label for="n">每轮次数 n</label><select id="n"><option>10</option><option selected>100</option><option>1000</option><option>10000</option></select></div><div class="group"><label for="probability">正面概率 p</label><select id="probability"><option>0.01</option><option>0.05</option><option>0.1</option><option>0.2</option><option selected>0.5</option><option>0.8</option><option>0.9</option><option>0.95</option><option>0.99</option></select></div><div class="group"><button id="play" class="primary">开始连续实验</button><button id="one">掷一轮</button><button id="batch">快速增加 1000 轮</button><button id="reset">重新开始</button></div><div class="group"><label for="speed">动画速度</label><input class="speed" id="speed" type="range" min="1" max="20" value="15"><span id="speedValue" class="small">15 轮/秒</span></div><span id="status" class="status">已暂停 · 0 轮</span></div>
<div class="grid"><section class="panel"><h2>大数定律</h2><div class="formula">X̄<sub>n</sub> = 正面次数 / n</div><canvas id="raw" class="chart" role="img" aria-label="正面频率直方图，横轴0到1，绿色区间为p附近0.05以内"></canvas><div class="legend"><span><i class="swatch"></i><span id="interval">距 p 不超过 0.05</span></span><span>横轴固定为 0–1 · 组距固定为 0.025</span></div><div class="metrics"><div class="metric"><span>区间外的实验占比</span><strong id="outside">—</strong><span class="small" id="theoreticalOutside"></span></div></div></section>
<section class="panel"><h2>中心极限定律</h2><div class="formula">Z<sub>n</sub> = √n (X̄<sub>n</sub> − p) / √[p(1−p)]</div><canvas id="standard" class="chart" role="img" aria-label="标准化结果的密度直方图与标准正态密度曲线"></canvas><div class="legend"><span><i class="swatch line"></i>标准正态 N(0, 1)</span><span>密度直方图 · 组距固定为 0.2</span></div><div class="metrics"><div class="metric"><span>标准化结果的平均值</span><strong id="zmean">—</strong><span class="small">理论值为 0</span></div><div class="metric"><span>标准化结果的标准差</span><strong id="zsd">—</strong><span class="small">理论值为 1</span></div></div></section></div>
</main><script>
const $=id=>document.getElementById(id);let p=.5,n=100,count=0,out=0,sum=0,sum2=0,headsSum=0,binsA=[],binsZ=[],balls=[],running=false,last=0,acc=0,raf=0,zwidth=0,zmin=0,zmax=0;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
// Binomial probabilities relative to their mode avoid underflow for large n.
function theoreticalOutside(){const mode=Math.floor((n+1)*p);let total=1,tail=Math.abs(mode-n*p)>.05*n+1e-10?1:0,w=1;for(let k=mode;k>0;k--){w*=k/(n-k+1)*(1-p)/p;total+=w;if(Math.abs(k-1-n*p)>.05*n+1e-10)tail+=w}w=1;for(let k=mode;k<n;k++){w*=(n-k)/(k+1)*p/(1-p);total+=w;if(Math.abs(k+1-n*p)>.05*n+1e-10)tail+=w}return tail/total}
function formatProbability(v){const percent=100*v;return percent>0&&percent<.001?percent.toExponential(2)+'%':percent.toFixed(3)+'%'}
function config(){n=+$('n').value;p=+$('probability').value;$('theoreticalOutside').textContent='理论值 '+formatProbability(theoreticalOutside());$('interval').textContent=`距 p 不超过 0.05：[${Math.max(0,p-.05).toFixed(2)}, ${Math.min(1,p+.05).toFixed(2)}]`;zwidth=.2;zmin=-6.1;zmax=6.1;binsA=Array(40).fill(0);binsZ=Array(61).fill(0)}
function stop(){running=false;$('play').textContent='开始连续实验'}
function clear(){stop();count=out=sum=sum2=headsSum=0;balls=[];acc=0;config();metrics();paint()}
function sample(){let h=0;for(let i=0;i<n;i++)h+=Math.random()<p;return h}
function add(animate=true){const h=sample(),x=h/n,z=(h-n*p)/Math.sqrt(n*p*(1-p));count++;out+=Math.abs(h-n*p)>.05*n+1e-10;sum+=z;sum2+=z*z;headsSum+=h;binsA[Math.min(39,Math.floor(x*40))]++;let j=Math.floor((z-zmin)/zwidth);if(j>=0&&j<binsZ.length)binsZ[j]++;if(animate&&!reduce)balls.push({x,z,time:performance.now()});if(balls.length>80)balls.shift();return {h,x,z}}
function metrics(){const num=v=>v.toFixed(3);$('status').textContent=`${running?'正在实验':'已暂停'} · ${count.toLocaleString()} 轮`;$('outside').textContent=count?(out/count*100).toFixed(1)+'%':'—';$('zmean').textContent=count?num(sum/count):'—';$('zsd').textContent=count>1?num(Math.sqrt(Math.max(0,(sum2-sum*sum/count)/(count-1)))):'—';}
function announce(){}
function setup(id){let c=$(id),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}let ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);return {ctx,w,h}}
function chart(id,standard){const {ctx:g,w,h}=setup(id),L=47,R=13,T=35,B=47,pw=w-L-R,ph=h-T-B;const lo=standard?zmin:0,hi=standard?zmax:1,bins=standard?binsZ:binsA,bw=standard?zwidth:1/40;const heights=bins.map(v=>count?v/count/(standard?bw:1):0),ymax=standard?Math.max(.48,...heights)*1.12:Math.max(.1,...heights)*1.2;const X=v=>L+(v-lo)/(hi-lo)*pw,Y=v=>h-B-v/ymax*ph;g.font='12px system-ui';g.fillStyle='#586d75';g.textAlign='left';g.fillText(standard?'概率密度':'每组占比',L,16);if(!standard){g.fillStyle='#e5f0e8';g.fillRect(X(Math.max(0,p-.05)),T,X(Math.min(1,p+.05))-X(Math.max(0,p-.05)),ph)}for(let i=0;i<=4;i++){let val=ymax*i/4,y=Y(val);g.strokeStyle='#e4e9e7';g.lineWidth=1;g.beginPath();g.moveTo(L,y);g.lineTo(w-R,y);g.stroke();g.fillStyle='#586d75';g.textAlign='right';g.fillText(standard?val.toFixed(2):(val*100).toFixed(0)+'%',L-6,y+4)}g.fillStyle='#397f91';bins.forEach((v,i)=>{const x=X(lo+i*bw),height=heights[i]/ymax*ph;g.fillRect(x+.5,Y(heights[i]),Math.max(1,pw*bw/(hi-lo)-1),height)});if(standard){g.strokeStyle='#d8793f';g.lineWidth=2;g.beginPath();for(let i=0;i<=250;i++){let z=lo+(hi-lo)*i/250,y=Math.exp(-z*z/2)/Math.sqrt(2*Math.PI);i?g.lineTo(X(z),Y(y)):g.moveTo(X(z),Y(y))}g.stroke()}else{g.strokeStyle='#568165';g.setLineDash([4,4]);g.beginPath();g.moveTo(X(p),T);g.lineTo(X(p),h-B);g.stroke();g.setLineDash([])}g.fillStyle='#19333c';g.textAlign='center';let ticks=standard?[-6,-3,0,3,6]:[0,.25,.5,.75,1];ticks.forEach(t=>g.fillText(t.toString(),X(t),h-B+21));g.fillText(standard?'标准化结果 Zₙ':'正面频率 X̄ₙ',L+pw/2,h-7);g.save();g.beginPath();g.rect(L,T-20,pw,ph+20);g.clip();const now=performance.now();for(const b of balls){let v=standard?b.z:b.x,t=Math.min(1,(now-b.time)/650),j=Math.max(0,Math.min(bins.length-1,Math.floor((v-lo)/bw))),target=Y(heights[j])-5,y=T-15+(target-(T-15))*t*t;g.fillStyle='#d8793f';g.beginPath();g.arc(X(v),y,4,0,Math.PI*2);g.fill()}g.restore()}
function paint(){chart('raw',false);chart('standard',true)}
function tick(t){let dt=Math.min(100,t-last||0);last=t;if(running){acc+=dt;let every=1000/+$('speed').value;while(acc>=every){acc-=every;const r=add();if(count%5===0)announce(r)}metrics()}balls=balls.filter(b=>t-b.time<650);if(running||balls.length)paint();raf=requestAnimationFrame(tick)}
$('n').onchange=clear;$('probability').onchange=clear;$('reset').onclick=clear;$('play').onclick=()=>{running=!running;acc=0;$('play').textContent=running?'暂停实验':'开始连续实验';metrics()};$('one').onclick=()=>{stop();let r=add();announce(r);metrics();paint()};$('batch').onclick=()=>{stop();balls=[];let r;for(let i=0;i<1000;i++)r=add(false);announce(r,1000);metrics();paint()};$('speed').oninput=()=>$('speedValue').textContent=$('speed').value+' 轮/秒';new ResizeObserver(paint).observe($('raw'));new ResizeObserver(paint).observe($('standard'));clear();raf=requestAnimationFrame(tick);
</script></body></html>

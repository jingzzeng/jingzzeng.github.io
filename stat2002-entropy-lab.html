<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圆内扔点 · 熵与分布</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#193540;font:16px/1.65 system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:1120px;margin:auto;padding:38px 24px}header{margin-bottom:26px}.eyebrow{color:#39747d;font-size:12px;letter-spacing:.13em}h1{font-size:34px;margin:10px 0}p{margin:8px 0;color:#526872}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr);gap:26px}.plot,.panel{background:white;border:1px solid #dce4de;border-radius:16px;padding:24px}canvas{display:block;width:100%;aspect-ratio:1}h2{font-size:18px;margin:0 0 18px}label{display:block;margin-top:20px}select,button{font:inherit;border:1px solid #b7cbc9;border-radius:7px;padding:9px 12px;background:white;color:#193540;max-width:100%}select{width:100%}button{cursor:pointer;background:#226e7b;color:white;margin-top:18px}input{width:100%;accent-color:#226e7b;margin:14px 0}.ends{display:flex;justify-content:space-between;font-size:13px;color:#526872}.metrics{border-top:1px solid #dce4de;margin-top:24px;padding-top:18px}.value{font-size:38px;line-height:1.4;font-variant-numeric:tabular-nums}.small{font-size:13px;color:#526872}.note{border-left:3px solid #d9874c;padding-left:13px;margin-top:18px}.legend{display:flex;gap:18px;justify-content:center;font-size:13px;color:#526872}.dot{color:#226e7b}.center{color:#cc692f}details{margin-top:24px;font-size:14px}summary{cursor:pointer;color:#226e7b}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d9874c;outline-offset:3px}.disabled{opacity:.45}@media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:24px 16px}.plot,.panel{padding:18px}h1{font-size:28px}}
.plot-entropy{font-size:24px;margin-bottom:12px;font-variant-numeric:tabular-nums}.legend{font-size:17px;flex-wrap:wrap}.plot #caption{font-size:19px;margin-top:14px}.panel{font-size:18px}.panel h2{font-size:21px}.ends,.small{font-size:15px}</style></head><body><main><header><div class="eyebrow">STAT2002 · LAB 02</div><h1>在圆内扔点：越分散，熵越大？</h1><p>在半径为 1 的圆内投下 1500 个点。调节分布的集中程度，观察散点与熵如何一起变化。</p></header><div class="layout"><div class="plot"><div class="plot-entropy" aria-live="polite">熵 H(X, Y) = <strong id="entropy"></strong></div><canvas id="plot" role="img" aria-label="单位圆内的二维随机散点"></canvas><div class="legend"><span class="dot">● 随机点</span><span class="center">＋ 正态分布的中心 μ</span></div><p class="small" id="caption" style="text-align:center"></p></div><div class="panel"><h2>选择一种扔点方式</h2><label for="mode">分布</label><select id="mode"><option value="normal">二维正态分布（限制在圆内）</option><option value="uniform">圆内均匀分布</option></select><div id="normalControls"><label for="center">正态分布的中心 μ</label><select id="center"><option value="0">圆心 (0, 0)</option><option value="1">圆周上的点 (1, 0)</option></select><label for="variance">方差参数 σ² = <strong id="varLabel"></strong></label><input id="variance" type="range" min="0" max="1000" value="500"><div class="ends"><span>0.0025 · 更集中</span><span>4 · 更分散</span></div><p class="small">σ² 是截断前每个坐标的方差；超出圆的点不保留。</p></div><button id="resample">重新扔 1500 个点</button></div></div></main><script>
const $=id=>document.getElementById(id);let points=[],sigma2=.1,mu=0,uniform=false;
// Midpoint quadrature on a Cartesian grid; stable at the minimum sigma=0.05.
function calculateEntropy(){if(uniform)return Math.log(Math.PI);const N=500,dx=2/N;let z=0,m=0;for(let i=0;i<N;i++){let x=-1+(i+.5)*dx;for(let j=0;j<N;j++){let y=-1+(j+.5)*dx;if(x*x+y*y>1)continue;let t=((x-mu)**2+y*y)/(2*sigma2),w=Math.exp(-t);z+=w;m+=w*t;}}return Math.log(z*dx*dx)+m/z}
function randomNormal(){let r=Math.sqrt(-2*Math.log(1-Math.random())),t=2*Math.PI*Math.random();return [r*Math.cos(t),r*Math.sin(t)]}
function sample(){points=[];while(points.length<1500){let x,y;if(uniform||sigma2>.3){let r=Math.sqrt(Math.random()),a=2*Math.PI*Math.random();x=r*Math.cos(a);y=r*Math.sin(a);if(!uniform&&Math.random()>Math.exp(-((x-mu)**2+y*y)/(2*sigma2)))continue;}else{let g=randomNormal();x=mu+Math.sqrt(sigma2)*g[0];y=Math.sqrt(sigma2)*g[1];if(x*x+y*y>1)continue;}points.push([x,y])}draw()}
function draw(){let canvas=$('plot'),w=canvas.clientWidth,dpr=window.devicePixelRatio||1;canvas.width=w*dpr;canvas.height=w*dpr;let c=canvas.getContext('2d');c.scale(dpr,dpr);let mid=w/2,r=w*.415;c.clearRect(0,0,w,w);c.strokeStyle='#e1e8e5';c.lineWidth=1;for(let v of [-.5,0,.5]){let l=Math.sqrt(1-v*v);c.beginPath();c.moveTo(mid+v*r,mid-l*r);c.lineTo(mid+v*r,mid+l*r);c.stroke();c.beginPath();c.moveTo(mid-l*r,mid+v*r);c.lineTo(mid+l*r,mid+v*r);c.stroke()}c.fillStyle='rgba(34,110,123,.43)';for(let [x,y] of points){c.beginPath();c.arc(mid+x*r,mid-y*r,Math.max(1.3,w/270),0,2*Math.PI);c.fill()}c.strokeStyle='#718e95';c.beginPath();c.arc(mid,mid,r,0,Math.PI*2);c.stroke();c.fillStyle='#526872';c.font='18px system-ui';c.textAlign='center';c.fillText('−1',mid-r,mid+r+23);c.fillText('0',mid,mid+r+23);c.fillText('1',mid+r,mid+r+23);c.fillText('x',mid+r+16,mid+4);c.fillText('y',mid,mid-r-15);if(!uniform){let x=mid+mu*r;c.strokeStyle='#cc692f';c.lineWidth=2.5;c.beginPath();c.moveTo(x-7,mid);c.lineTo(x+7,mid);c.moveTo(x,mid-7);c.lineTo(x,mid+7);c.stroke()}}
function update(){uniform=$('mode').value==='uniform';mu=+$('center').value;sigma2=.0025*Math.pow(1600,+$('variance').value/1000);$('varLabel').textContent=sigma2.toFixed(4);$('center').disabled=$('variance').disabled=uniform;$('normalControls').classList.toggle('disabled',uniform);let h=calculateEntropy();$('entropy').textContent=h.toFixed(3);$('caption').textContent=uniform?'均匀分布 · 相同面积的区域有相同的落点概率':`截断二维正态 · μ = (${mu}, 0)，σ² = ${sigma2.toFixed(4)}`;sample()}
$('mode').onchange=update;$('center').onchange=update;$('variance').oninput=update;$('resample').onclick=sample;new ResizeObserver(draw).observe($('plot'));update();
</script></body></html>
